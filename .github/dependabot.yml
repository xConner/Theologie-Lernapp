# Wöchentliche Hinweise auf Updates der Abhängigkeiten (Pull Requests werden
# nicht automatisch gemergt – jedes Update vor dem Mergen testen).
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
