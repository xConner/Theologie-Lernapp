# Machbarkeitstest der UnivIS-PRG-Schnittstelle (docs/univis-integration-feasibility.md).
# Läuft auf GitHub-Runnern, weil die Entwicklungsumgebung univis.uni-kiel.de
# nicht erreicht. Kein Zeitplan: nur manuell oder beim Ändern dieser Datei auf
# einem claude/-Branch. Höchstens zwei Anfragen je Lauf (Einrichtung suchen,
# Veranstaltungen abrufen) mit Pause dazwischen bzw. eine Anfrage
# (Wochentagsprüfung).
#
# Die Protokolle sind öffentlich: Lehrpersonen und Freitexte werden
# geschwärzt (--redact), Personen-Datensätze nur gezählt, Rohantworten nicht
# gespeichert.
name: UnivIS-Abruftest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe = Katalog abrufen, weekday = Wochentagscodes prüfen"
        type: choice
        options: [probe, weekday]
        default: probe
      sem:
        description: Semester (z. B. 2026w)
        default: 2026w
      query:
        description: Suchbegriff für die Einrichtung (ohne Umlaute)
        default: Theologische
      name:
        description: Exakter Name der Einrichtung in UnivIS
        default: Theologische Fakultät
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/univis-probe.yml"]

permissions:
  contents: read

concurrency:
  group: univis-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Ein Push dieser Datei führt nur die Prüfung aus, die hier steht.
      MODE: ${{ inputs.mode || 'weekday' }}
      SEM: ${{ inputs.sem || '2026w' }}
      DEPT_QUERY: ${{ inputs.query || 'Theologische' }}
      DEPT_NAME: ${{ inputs.name || 'Theologische Fakultät' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts

      - name: Organisationsnummer aus UnivIS ermitteln
        if: env.MODE == 'probe'
        run: |
          node tool/univis/univis_find_department.mjs --name "$DEPT_QUERY" | tee dept.json

      - name: Veranstaltungen der Einrichtung abrufen
        if: env.MODE == 'probe'
        run: |
          sleep 5
          # OrgNr (Element <orgnr> des Org-Datensatzes) nur übernehmen, wenn
          # genau EINE Einrichtung exakt so heißt – sonst kein Abruf.
          ORG=$(node -e '
            const d = JSON.parse(require("fs").readFileSync("dept.json", "utf8"));
            const hits = (d.departments || []).filter(x => x.fields.name === process.env.DEPT_NAME);
            const nr = hits.length === 1 ? hits[0].fields.orgnr : "";
            process.stdout.write(/^\d{9}$/.test(nr || "") ? nr : "");
          ' || true)
          if [ -z "$ORG" ]; then
            echo "Keine eindeutige OrgNr für \"$DEPT_NAME\" gefunden – Abruf übersprungen."
            exit 1
          fi
          echo "OrgNr: $ORG"
          node tool/univis/univis_probe.mjs --sem "$SEM" \
            --param "department=$ORG" --sample 2 --redact

      # Veranstaltung 010076 hat laut XML (WS 2026/27) den Code "w1 4",
      # 16:15-17:45; die Klartextansicht zeigt, welcher Wochentag das ist.
      - name: Wochentagscodes gegen die Klartextansicht prüfen
        if: env.MODE == 'weekday'
        run: node tool/univis/univis_check_weekday.mjs --sem "$SEM" --number 010076
