# Machbarkeitstest der UnivIS-PRG-Schnittstelle (docs/univis-integration-feasibility.md).
# Läuft auf GitHub-Runnern, weil die Entwicklungsumgebung univis.uni-kiel.de
# nicht erreicht. Kein Zeitplan: nur manuell oder beim Ändern dieser Datei auf
# einem claude/-Branch. Höchstens zwei Anfragen je Lauf (Einrichtung suchen,
# Veranstaltungen abrufen) mit Pause dazwischen bzw. eine Anfrage
# (Wochentagsprüfung; Vercel-Test: ein Abruf aus der Vercel-Funktion, danach
# Zwischenspeicher).
#
# Die Protokolle sind öffentlich: Ausgegeben werden nur Kennzahlen,
# Elementnamen, Organisationsnummern und Wochentag/Uhrzeit – keine
# Stichproben, keine Personen, keine Freitexte, keine Rohantworten.
name: UnivIS-Abruftest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "catalog = Backend auf echten Daten (Kennzahlen), probe = XML-Inventar, schedule = Terminangaben gegen Klartext prüfen, search = Titelsuche und Fakultätsnummern, vercel = Katalog-Endpunkt im Vercel-Preview, production = Katalog-Endpunkt auf www.theologie.app"
        type: choice
        options: [catalog, probe, schedule, search, vercel, production]
        default: catalog
      sem:
        description: Semester (z. B. 2026w)
        default: 2026w
      query:
        description: Suchbegriff für die Einrichtung (ohne Umlaute)
        default: Theologische
      name:
        description: Exakter Name der Einrichtung in UnivIS
        default: Theologische Fakultät
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/univis-probe.yml"]

permissions:
  contents: read
  deployments: read

concurrency:
  group: univis-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Ein Push dieser Datei führt nur die Prüfung aus, die hier steht
      # (Produktion: Katalog und Suche, höchstens sechs UnivIS-Abrufe aus der
      # Vercel-Funktion, meist aus dem Zwischenspeicher).
      MODE: ${{ inputs.mode || 'production' }}
      SEM: ${{ inputs.sem || '2026w' }}
      DEPT_QUERY: ${{ inputs.query || 'Theologische' }}
      DEPT_NAME: ${{ inputs.name || 'Theologische Fakultät' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts

      - name: Organisationsnummer aus UnivIS ermitteln
        if: contains(env.MODE, 'probe')
        run: |
          node tool/univis/univis_find_department.mjs --name "$DEPT_QUERY" | tee dept.json

      - name: Veranstaltungen der Einrichtung abrufen
        if: contains(env.MODE, 'probe')
        run: |
          sleep 5
          # OrgNr (Element <orgnr> des Org-Datensatzes) nur übernehmen, wenn
          # genau EINE Einrichtung exakt so heißt – sonst kein Abruf.
          ORG=$(node -e '
            const d = JSON.parse(require("fs").readFileSync("dept.json", "utf8"));
            const hits = (d.departments || []).filter(x => x.fields.name === process.env.DEPT_NAME);
            const nr = hits.length === 1 ? hits[0].fields.orgnr : "";
            process.stdout.write(/^\d{9}$/.test(nr || "") ? nr : "");
          ' || true)
          if [ -z "$ORG" ]; then
            echo "Keine eindeutige OrgNr für \"$DEPT_NAME\" gefunden – Abruf übersprungen."
            exit 1
          fi
          echo "OrgNr: $ORG"
          node tool/univis/univis_probe.mjs --sem "$SEM" \
            --param "department=$ORG" --sample 0 --redact

      # Terminangaben gegen die Klartextansicht (nur Wörter einer festen
      # Liste): 010076 = w1 4 (Do 16:15-17:45), 010000 = 14-täglich,
      # 010032/010036 = Block mit Tagen, 010008 = Block ohne Tage
      # (Nummern aus der Kennzahlenausgabe von catalog_stats.mjs).
      - name: Terminangaben gegen die Klartextansicht prüfen
        if: contains(env.MODE, 'schedule')
        run: |
          sleep 5
          node tool/univis/univis_check_schedule.mjs --sem "$SEM" \
            --number 010076 --number 010000 --number 010032 --number 010036 --number 010008

      # Titelsuche und Fakultätsnummern (höchstens sechs Anfragen, nur Kennzahlen
      # und Namen von Einrichtungen).
      - name: Titelsuche und Fakultäten prüfen
        if: env.MODE == 'search'
        run: node tool/univis/univis_search_probe.mjs --sem "$SEM"

      # Katalogverarbeitung (api/_lib/catalog) mit EINER Anfrage, nur Kennzahlen.
      - name: Katalog-Backend auf echten Daten prüfen
        if: contains(env.MODE, 'catalog')
        run: node tool/univis/catalog_stats.mjs --sem "$SEM" --org 010000000

      # Wartet auf das Vercel-Preview dieses Commits und prüft den
      # Katalog-Endpunkt (api/catalog.ts): höchstens ein UnivIS-Abruf je
      # Semester, nur Zählwerte im Protokoll. Previews sind durch Vercel Authentication
      # geschützt; der Abruf braucht das Repository-Secret
      # VERCEL_AUTOMATION_BYPASS_SECRET („Protection Bypass for Automation“
      # in den Vercel-Projekteinstellungen).
      # production: wartet auf das Produktions-Deployment dieses Commits und
      # prüft dann die öffentliche Domain (ohne Bypass-Secret).
      - name: Katalog-Endpunkt im Vercel-Preview bzw. in Produktion prüfen
        if: env.MODE == 'vercel' || env.MODE == 'production'
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/$1"; }
          if [ "$MODE" = "production" ]; then
            # Der neue Code ist live, sobald ein zu kurzer Suchbegriff mit 400
            # abgelehnt wird (ältere Stände ohne Suche antworten mit 200; kein
            # UnivIS-Abruf).
            URL="https://www.theologie.app"
            BYPASS=""
            READY=""
            for i in $(seq 1 30); do
              CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$URL/api/catalog?semester=2026w&q=ab" || echo 000)
              [ "$CODE" = "400" ] && READY=1 && break
              echo "Noch nicht bereit (HTTP $CODE), warte …"
              sleep 20
            done
            if [ -z "$READY" ]; then
              echo "Produktion liefert noch keinen Stand mit Suche. Deployments zu $SHA:"
              api "deployments?sha=$SHA&per_page=10" | jq -c '[.[] | {environment, created_at}]'
              exit 1
            fi
          else
            URL=""
            for i in $(seq 1 30); do
              for id in $(api "deployments?sha=$SHA&per_page=10" | jq -r '.[] | select(.environment | test("^Production") | not) | .id'); do
                URL=$(api "deployments/$id/statuses" | jq -r '[.[] | select(.state=="success")][0].environment_url // empty')
                [ -n "$URL" ] && break
              done
              [ -n "$URL" ] && break
              sleep 10
            done
            if [ -z "$URL" ]; then
              echo "Kein erfolgreiches Vercel-Preview für $SHA gefunden."
              exit 1
            fi
          fi
          echo "Ziel: $URL"
          if [ "$MODE" = "vercel" ] && [ -z "$BYPASS" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET fehlt – geschütztes Preview nicht prüfbar."
            exit 1
          fi
          # Secret über stdin als curl-Konfiguration statt als Argument: nicht
          # in der Prozessliste, nicht in einer Datei, nicht im Protokoll.
          # Kein -L: Weiterleitungen (z. B. zur Vercel-Anmeldung) nicht folgen.
          fetch() {
            { [ -n "$BYPASS" ] && printf 'header = "x-vercel-protection-bypass: %s"\n' "$BYPASS"; true; } \
              | curl -sS -K - -D headers.txt -o result.json -w "%{http_code}" --max-time 60 \
                "$URL$1" || echo "curl-Fehler"
          }
          # Nur Status, Kopfzeilen und Zählwerte ausgeben – keine Titel, Namen
          # oder Räume (öffentliches Protokoll).
          summary() {
            echo "HTTP $1"
            grep -iE '^(x-vercel-id|x-catalog-state|cache-control|x-vercel-cache):' headers.txt || true
            if jq -e . result.json >/dev/null 2>&1; then
              jq -c '{semesters: (.semesters // null | if . then map(.id) else null end),
                      semester: .semester.id?, courses: (.courses // null | if . then length else null end),
                      occurrences: (.occurrences // null | if . then length else null end),
                      persons: (.persons // null | if . then length else null end),
                      synthetic, cache, counts, search, error, code}' result.json
            else
              sed -e 's/<[^>]*>/ /g' result.json | tr -s ' \n' ' ' | head -c 200; echo
            fi
          }
          FAIL=0
          echo "== Semesterliste (ohne UnivIS-Abruf)"
          CODE=$(fetch "/api/catalog"); summary "$CODE"; [ "$CODE" = "200" ] || FAIL=1
          echo "== WS 2026/27 (ein UnivIS-Abruf)"
          CODE=$(fetch "/api/catalog?semester=2026w"); summary "$CODE"; [ "$CODE" = "200" ] || FAIL=1
          echo "== WS 2026/27 erneut (muss aus dem Zwischenspeicher kommen)"
          CODE=$(fetch "/api/catalog?semester=2026w"); summary "$CODE"; [ "$CODE" = "200" ] || FAIL=1
          echo "== ungültiges Semester (muss 400 sein)"
          CODE=$(fetch "/api/catalog?semester=1999w"); echo "HTTP $CODE"; [ "$CODE" = "400" ] || FAIL=1
          echo "== Suche: Titel in einer anderen Fakultät (ein UnivIS-Abruf)"
          CODE=$(fetch "/api/catalog?semester=2026w&q=Ethik&faculty=050000000"); summary "$CODE"; [ "$CODE" = "200" ] || FAIL=1
          echo "== Suche: Umlaut im Suchbegriff, Theologische Fakultät (ein UnivIS-Abruf)"
          CODE=$(fetch "/api/catalog?semester=2026w&q=Einf%C3%BChrung&faculty=010000000"); summary "$CODE"; [ "$CODE" = "200" ] || FAIL=1
          echo "== Suche: Wörter in anderer Reihenfolge (Rückfallsuche, zwei UnivIS-Abrufe)"
          CODE=$(fetch "/api/catalog?semester=2026w&q=Ethik%20Einf%C3%BChrung"); summary "$CODE"; [ "$CODE" = "200" ] || FAIL=1
          echo "== Suche: Veranstaltungsnummer (ein UnivIS-Abruf)"
          CODE=$(fetch "/api/catalog?semester=2026w&number=010076"); summary "$CODE"; [ "$CODE" = "200" ] || FAIL=1
          echo "== Suche: zu kurzer Begriff (muss 400 sein, kein Abruf)"
          CODE=$(fetch "/api/catalog?semester=2026w&q=ab"); echo "HTTP $CODE"; [ "$CODE" = "400" ] || FAIL=1
          rm -f result.json headers.txt
          exit $FAIL
