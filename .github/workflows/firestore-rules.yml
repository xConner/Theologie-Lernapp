# Tests der firestore.rules im Firestore-Emulator (test/firestore_rules).
# Keine Secrets, kein Zugriff auf das echte Firebase-Projekt: Der Emulator
# läuft mit einem Demo-Projekt („demo-…“). Die Regeln in der Firebase Console
# werden hiervon NICHT geändert (Anleitung: docs/univis-integration-feasibility.md).
name: Firestore-Regeln

on:
  push:
    paths:
      - firestore.rules
      - test/firestore_rules/**
      - .github/workflows/firestore-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - test/firestore_rules/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: test/firestore_rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Emulator-JAR zwischenspeichern: Der Download ist der langsamste und
      # störanfälligste Schritt.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('test/firestore_rules/package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      - name: Firestore-Emulator vorab laden
        run: |
          for i in 1 2 3; do
            timeout 180 npx firebase setup:emulators:firestore && break
            echo "Download fehlgeschlagen, neuer Versuch ($i) …"
          done
      - run: npm test
