# Tests der firestore.rules im Firestore-Emulator (test/firestore_rules).
# Keine Secrets, kein Zugriff auf das echte Firebase-Projekt: Der Emulator
# läuft mit einem Demo-Projekt („demo-…“). Die Regeln in der Firebase Console
# werden hiervon NICHT geändert (Anleitung: docs/univis-integration-feasibility.md).
name: Firestore-Regeln

on:
  push:
    paths:
      - firestore.rules
      - test/firestore_rules/**
      - .github/workflows/firestore-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - test/firestore_rules/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: test/firestore_rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm test
