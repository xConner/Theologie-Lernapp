<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Theologie Lernapp</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Firebase Phone Auth rendert ein unsichtbares reCAPTCHA; FlutterFire räumt
    es nie ab, daher bliebe das Badge dauerhaft sichtbar. Ausblenden ist
    erlaubt, weil die SMS-Screens stattdessen den reCAPTCHA-Hinweistext zeigen
    (lib/widgets/recaptcha_notice.dart). Wichtig: visibility, nicht display:none,
    sonst funktioniert das unsichtbare reCAPTCHA nicht mehr. Eine eventuelle
    Bildauswahl-Challenge liegt in einem separaten iframe und bleibt sichtbar.
  -->
  <style>
    .grecaptcha-badge { visibility: hidden; }

    /*
      Mobile: Flutter setzt auf <body> position:fixed, overflow:hidden und
      touch-action:none. reCAPTCHA platziert seine Bild-Challenge absolut in
      Dokument-Koordinaten - auf kleinen Viewports (und nach dem Schließen der
      Tastatur) landet sie dadurch außerhalb des sichtbaren Bereichs und kann
      nicht gescrollt werden. Folge: Challenge unsichtbar, verifyPhoneNumber()
      wartet endlos, keine SMS. Daher die Challenge auf Touch-Geräten fest im
      Viewport zentrieren. Desktop (feiner Zeiger) bleibt unverändert.
    */
    @media (pointer: coarse) {
      div:has(> iframe[src*="/recaptcha/"][src*="bframe"]) {
        position: fixed !important;
        top: 50% !important;
        left: 50% !important;
        right: auto !important;
        bottom: auto !important;
        transform: translate(-50%, -50%) !important;
        max-width: 100vw !important;
        max-height: 100dvh !important;
        overflow: auto !important;
        touch-action: auto !important;
      }
    }
  </style>
</head>

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.

    or to give the user feedback during the initialization process.

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
